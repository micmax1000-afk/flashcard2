<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#4f8ef7"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0a1a3a" flood-opacity="0.35"/>
    </filter>
    <!-- clip per la bandiera sulla card -->
    <clipPath id="flagClip">
      <rect x="116" y="146" width="280" height="230" rx="28"/>
    </clipPath>
  </defs>

  <!-- sfondo -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- card dietro (effetto mazzo) -->
  <rect x="136" y="160" width="280" height="230" rx="28"
        fill="#ffffff" opacity="0.25" transform="rotate(-8 276 275)"/>

  <!-- card principale con ombra -->
  <g filter="url(#shadow)">
    <rect x="116" y="146" width="280" height="230" rx="28" fill="url(#card)"/>
  </g>

  <!-- Union Jack stilizzata (dentro la card) -->
  <g clip-path="url(#flagClip)">
    <!-- campo blu -->
    <rect x="116" y="146" width="280" height="230" fill="#0b2f7a"/>
    <!-- croce bianca diagonale (X) -->
    <path d="M116 146 L396 376 M396 146 L116 376"
          stroke="#ffffff" stroke-width="46" stroke-linecap="butt"/>
    <!-- croce rossa diagonale (X) -->
    <path d="M116 146 L396 376 M396 146 L116 376"
          stroke="#d21f3c" stroke-width="18" stroke-linecap="butt"/>
    <!-- croce bianca dritta -->
    <path d="M256 146 V376 M116 261 H396"
          stroke="#ffffff" stroke-width="70"/>
    <!-- croce rossa dritta -->
    <path d="M256 146 V376 M116 261 H396"
          stroke="#d21f3c" stroke-width="38"/>
  </g>

  <!-- bordo card -->
  <rect x="116" y="146" width="280" height="230" rx="28"
        fill="none" stroke="#ffffff" stroke-width="4" opacity="0.6"/>

  <!-- etichetta "Aa" in basso a destra, fuori dalla bandiera -->
  <circle cx="378" cy="360" r="46" fill="#ffffff"/>
  <text x="378" y="378"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="44" font-weight="800" fill="#1e3a8a"
        text-anchor="middle" letter-spacing="-2">Aa</text>
</svg>
