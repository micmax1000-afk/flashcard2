<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcard – Impara le lingue</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f7fb; --card-bg: #ffffff; --text: #1f2937; --muted: #6b7280;
      --accent: #3b82f6; --accent-dark: #2563eb; --success: #10b981; --danger: #ef4444;
      --warn: #f59e0b; --border: #e5e7eb; --shadow: 0 4px 16px rgba(0,0,0,.08); --radius: 16px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; padding: 16px;
      display: flex; flex-direction: column; align-items: center;
    }
    header { width: 100%; max-width: 720px; margin-bottom: 16px; text-align: center; }
    header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
    header p  { font-size: 0.85rem; color: var(--muted); }
    .controls {
      width: 100%; max-width: 720px; display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 8px; margin-bottom: 10px;
    }
    @media (max-width: 560px) { .controls { grid-template-columns: 1fr; } }
    .controls label {
      display: block; font-size: 0.7rem; text-transform: uppercase;
      letter-spacing: .05em; color: var(--muted); margin-bottom: 4px;
    }
    .controls select {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--card-bg);
      font-size: 0.9rem; color: var(--text); cursor: pointer;
    }
    .extras {
      width: 100%; max-width: 720px; display: flex; flex-wrap: wrap; gap: 10px;
      align-items: center; margin-bottom: 12px; padding: 10px 12px;
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
      font-size: 0.85rem;
    }
    .extras label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .extras input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
    .extras .tool-btn {
      padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: transparent; font-size: 0.8rem; color: var(--text); cursor: pointer;
    }
    .extras .tool-btn.danger { color: var(--danger); border-color: var(--danger); }
    .extras .spacer { flex: 1; }
    .voice-panel {
      width: 100%; max-width: 720px; background: var(--card-bg);
      border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow: hidden;
    }
    .voice-header {
      display: flex; align-items: center; gap: 8px; padding: 12px 14px; cursor: pointer;
      user-select: none; font-size: 0.9rem; font-weight: 600;
    }
    .voice-header .chev { transition: transform .2s; font-size: 0.7rem; color: var(--muted); }
    .voice-panel.open .voice-header .chev { transform: rotate(90deg); }
    .badge {
      margin-left: auto; font-size: 0.7rem; font-weight: 700; padding: 3px 8px;
      border-radius: 999px; background: var(--border); color: var(--muted);
    }
    .badge.warn { background: #fef3c7; color: #b45309; }
    .badge.good { background: #d1fae5; color: #047857; }
    .voice-body { display: none; padding: 0 14px 14px; }
    .voice-panel.open .voice-body { display: block; }
    .voice-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .voice-row select {
      flex: 1; min-width: 160px; padding: 10px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--card-bg); font-size: 0.9rem;
    }
    .small-btn {
      padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--card-bg); font-size: 0.85rem; cursor: pointer; min-height: 44px;
    }
    .voice-hint { font-size: 0.8rem; color: var(--muted); line-height: 1.45; }
    .progress {
      width: 100%; max-width: 720px; display: flex; align-items: center; gap: 8px;
      font-size: 0.8rem; color: var(--muted); margin-bottom: 12px;
    }
    .progress-bar { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .progress-bar > div { height: 100%; background: var(--accent); width: 0; transition: width .25s; }
    .card-wrap { width: 100%; max-width: 720px; min-height: 240px; margin-bottom: 12px; }
    .actions {
      width: 100%; max-width: 720px; display: grid; grid-template-columns: 1fr 1.2fr 1fr;
      gap: 8px; margin-bottom: 8px;
    }
    .actions.secondary { grid-template-columns: 1fr 1fr; }
    .btn {
      padding: 14px; border-radius: 12px; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; background: var(--card-bg); color: var(--text);
      border: 1px solid var(--border); min-height: 48px;
    }
    .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.success { background: var(--success); color: #fff; border-color: var(--success); }
    .btn.danger  { background: var(--danger);  color: #fff; border-color: var(--danger); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    footer { width: 100%; max-width: 720px; text-align: center; font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #1f2937; color: #fff; padding: 12px 20px; border-radius: 10px;
      font-size: 0.85rem; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
      z-index: 200; max-width: 90vw;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
  </style>
</head>
<body>
  <header>
    <h1>🃏 Flashcard</h1>
    <p>Impara le lingue — tema, difficoltà, ripetizione spaziata</p>
  </header>

  <div class="controls">
    <div>
      <label for="deckSelect">Mazzo</label>
      <select id="deckSelect"></select>
    </div>
    <div>
      <label for="themeSelect">Tema</label>
      <select id="themeSelect"><option value="">Tutti i temi</option></select>
    </div>
    <div>
      <label for="levelSelect">Difficoltà</label>
      <select id="levelSelect"><option value="">Tutti i livelli</option></select>
    </div>
  </div>

  <div class="extras">
    <label><input type="checkbox" id="reviewOnly" /> 🔴 Solo da rivedere</label>
    <label><input type="checkbox" id="dueOnly" /> ⏰ Solo in scadenza</label>
    <label><input type="checkbox" id="autoSpeak" checked /> 🔊 Auto-pronuncia</label>
    <span class="spacer"></span>
    <button class="tool-btn" id="exportBtn" title="Esporta progressi come JSON">📤 Esporta</button>
    <button class="tool-btn" id="importBtn" title="Importa progressi da JSON">📥 Importa</button>
    <button class="tool-btn danger" id="resetBtn" title="Azzera progressi del mazzo corrente">↺ Reset</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden />
  </div>

  <div class="voice-panel" id="voicePanel">
    <div class="voice-header" id="voiceHeader">
      <span class="chev">▶</span>
      <span>🎙️ Voce TTS</span>
      <span class="badge" id="voiceBadge">Caricamento…</span>
    </div>
    <div class="voice-body">
      <div class="voice-row">
        <select id="voiceSelect"></select>
        <button class="small-btn" id="voiceTestBtn">▶ Prova</button>
        <button class="small-btn" id="voiceResetBtn" title="Torna alla scelta automatica">Auto</button>
      </div>
      <div class="voice-hint" id="voiceHint">—</div>
    </div>
  </div>

  <div class="progress">
    <span id="counter">0 / 0</span>
    <div class="progress-bar"><div id="progressFill"></div></div>
    <span id="pct">0%</span>
  </div>

  <div id="cardWrap" class="card-wrap"></div>

  <div class="actions">
    <button id="prevBtn" class="btn">← Indietro</button>
    <button id="flipBtn" class="btn primary">Gira</button>
    <button id="nextBtn" class="btn">Avanti →</button>
  </div>
  <div class="actions secondary">
    <button id="knowBtn"   class="btn success">✓ Lo sapevo</button>
    <button id="reviewBtn" class="btn danger">✗ Da rivedere</button>
  </div>

  <footer><span id="stats">—</span></footer>
  <div id="toast" class="toast"></div>

  <script src="data.js"></script>
  <script src="meta.js"></script>
  <script src="tts.js"></script>
  <script src="app.js"></script>
</body>
</html>
