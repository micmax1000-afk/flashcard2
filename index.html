<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
  <meta name="description" content="Flashcard con ripetizione dilazionata per imparare vocabolario." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/public/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/public/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/base.css" />
  <title>Flashcards</title>
</head>
<body>
  <a class="skip-link" href="#main">Salta al contenuto</a>

  <header class="app-header">
    <div class="app-header__inner">
      <h1 class="app-title">Flashcards</h1>
      <nav class="app-nav" aria-label="Principale">
        <a href="#/home" data-route>Home</a>
        <a href="#/decks" data-route>Mazzi</a>
        <a href="#/stats" data-route>Statistiche</a>
        <a href="#/settings" data-route>Impostazioni</a>
      </nav>
      <button type="button" id="theme-toggle" class="btn-icon" aria-label="Cambia tema">🌓</button>
    </div>
  </header>

  <main id="main" class="app-main" tabindex="-1"></main>

  <template id="view-home">
    <section class="view view--home">
      <h2>Pronto a studiare?</h2>
      <p class="muted">Carte in scadenza oggi e nuove carte da imparare.</p>
      <div class="home-summary" id="home-summary"></div>
      <div class="home-actions">
        <a href="#/study" class="btn btn-primary">Inizia sessione</a>
        <a href="#/quiz" class="btn">Quiz</a>
      </div>
    </section>
  </template>

  <template id="view-study">
    <section class="view view--study">
      <div class="study-header">
        <progress id="study-progress" value="0" max="1"></progress>
        <button type="button" id="study-exit" class="btn-icon" aria-label="Esci dalla sessione">✕</button>
      </div>
      <div id="study-card" class="card-slot" aria-live="polite"></div>
      <div id="study-controls" class="study-controls"></div>
    </section>
  </template>

  <template id="view-quiz">
    <section class="view view--quiz">
      <h2>Quiz</h2>
      <div id="quiz-card" class="card-slot"></div>
    </section>
  </template>

  <template id="view-stats">
    <section class="view view--stats">
      <h2>Statistiche</h2>
      <div id="stats-content"></div>
    </section>
  </template>

  <template id="view-decks">
    <section class="view view--decks">
      <h2>Mazzi</h2>
      <div id="decks-list"></div>
    </section>
  </template>

  <template id="view-settings">
    <section class="view view--settings">
      <h2>Impostazioni</h2>
      <div id="settings-content"></div>
    </section>
  </template>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
