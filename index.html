<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcard – Impara le lingue</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f7fb;
      --card-bg: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #3b82f6;
      --accent-dark: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --border: #e5e7eb;
      --shadow: 0 4px 16px rgba(0,0,0,.08);
      --radius: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header { width: 100%; max-width: 720px; margin-bottom: 16px; text-align: center; }
    header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
    header p  { font-size: 0.85rem; color: var(--muted); }

    .controls {
      width: 100%; max-width: 720px;
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 8px; margin-bottom: 10px;
    }
    @media (max-width: 560px) { .controls { grid-template-columns: 1fr; } }
    .controls label {
      display: block; font-size: 0.7rem; text-transform: uppercase;
      letter-spacing: .05em; color: var(--muted); margin-bottom: 4px;
    }
    .controls select {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--card-bg);
      font-size: 0.9rem; color: var(--text); cursor: pointer;
    }
    .controls select:focus { outline: 2px solid var(--accent); }

    .extras {
      width: 100%; max-width: 720px;
      display: flex; flex-wrap: wrap; gap: 10px;
      align-items: center; margin-bottom: 12px;
      padding: 10px 12px; background: var(--card-bg);
      border: 1px solid var(--border); border-radius: 12px;
      font-size: 0.85rem;
    }
    .extras label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .extras input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
    .extras .tool-btn {
      padding: 6px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: transparent;
      font-size: 0.8rem; color: var(--text); cursor: pointer;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .extras .tool-btn:hover { border-color: var(--accent); color: var(--accent); }
    .extras .tool-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
    .extras .spacer { margin-left: auto; }

    .progress {
      width: 100%; max-width: 720px;
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 12px; font-size: 0.85rem; color: var(--muted);
    }
    .progress-bar {
      flex: 1; height: 8px; background: var(--border);
      border-radius: 4px; overflow: hidden;
    }
    .progress-bar > div {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-dark));
      width: 0%; transition: width .3s ease;
    }

    .card-wrap {
      width: 100%; max-width: 720px;
      perspective: 1200px; margin-bottom: 16px;
    }
    .card {
      position: relative; width: 100%; min-height: 340px;
      cursor: pointer; transform-style: preserve-3d;
      transition: transform .5s cubic-bezier(.4,.0,.2,1);
    }
    .card.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 24px;
      background: var(--card-bg); border-radius: var(--radius);
      box-shadow: var(--shadow); backface-visibility: hidden;
      border: 1px solid var(--border);
    }
    .card-back { transform: rotateY(180deg); }

    .card-emoji { font-size: 3rem; line-height: 1; }
    .card-text  { font-size: 2rem; font-weight: 700; text-align: center; }
    .card-phon  { font-size: 1rem; color: var(--muted); font-style: italic; }

    .card-badge {
      position: absolute; top: 12px; left: 12px;
      font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .05em; padding: 4px 10px; border-radius: 999px;
      background: var(--accent); color: #fff;
    }
    .card-badge.theme { left: auto; right: 56px; background: var(--muted); }
    .card-badge.box {
      top: auto; bottom: 12px; left: 12px;
      background: var(--border); color: var(--muted);
      font-size: 0.65rem;
    }
    .card-badge.box.active { background: var(--success); color: #fff; }

    .card-hint {
      position: absolute; bottom: 12px; right: 12px;
      font-size: 0.75rem; color: var(--muted);
    }

    /* Pulsante audio in alto a destra */
    .card-audio {
      position: absolute;
      top: 10px; right: 10px;
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--card-bg);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      transition: background .2s ease, transform .1s ease;
      z-index: 2;
    }
    .card-audio:hover { background: var(--bg); transform: scale(1.05); }
    .card-audio:active { transform: scale(.95); }
    .card-audio.speaking { background: var(--accent); color: #fff; border-color: var(--accent); }

    .actions {
      width: 100%; max-width: 720px;
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
    }
    .actions.secondary { margin-top: 8px; grid-template-columns: 1fr 1fr; }

    .btn {
      padding: 14px; border-radius: 12px; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: transform .1s ease, background .2s ease;
      background: var(--card-bg); color: var(--text);
      border: 1px solid var(--border);
    }
    .btn:hover  { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.primary:hover { background: var(--accent-dark); }
    .btn.success { background: var(--success); color: #fff; border-color: var(--success); }
    .btn.danger  { background: var(--danger);  color: #fff; border-color: var(--danger); }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    .empty {
      width: 100%; max-width: 720px; padding: 40px 20px;
      text-align: center; color: var(--muted);
      background: var(--card-bg); border-radius: var(--radius);
      border: 1px dashed var(--border);
    }
    .empty h2 { font-size: 1.1rem; margin-bottom: 8px; color: var(--text); }

    footer {
      margin-top: 24px; font-size: 0.75rem; color: var(--muted);
      text-align: center; line-height: 1.6;
    }

    /* Toast per feedback (import/export) */
    .toast {
      position: fixed;
      bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: #1f2937; color: #fff;
      padding: 12px 20px; border-radius: 10px;
      font-size: 0.85rem; font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,.2);
      opacity: 0; pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
      z-index: 1000;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { background: var(--success); }
    .toast.error   { background: var(--danger); }
  </style>
</head>
<body>

  <header>
    <h1>🃏 Flashcard</h1>
    <p>Impara le lingue — tema, difficoltà, ripetizione spaziata</p>
  </header>

  <!-- Selettori -->
  <div class="controls">
    <div>
      <label for="deckSelect">Mazzo</label>
      <select id="deckSelect"></select>
    </div>
    <div>
      <label for="themeSelect">Tema</label>
      <select id="themeSelect"><option value="">Tutti i temi</option></select>
    </div>
    <div>
      <label for="levelSelect">Difficoltà</label>
      <select id="levelSelect"><option value="">Tutti i livelli</option></select>
    </div>
  </div>

  <!-- Filtri extra + strumenti -->
  <div class="extras">
    <label>
      <input type="checkbox" id="reviewOnly" />
      🔴 Solo da rivedere
    </label>
    <label>
      <input type="checkbox" id="dueOnly" />
      ⏰ Solo in scadenza
    </label>
    <label>
      <input type="checkbox" id="autoSpeak" checked />
      🔊 Auto-pronuncia
    </label>
    <span class="spacer"></span>
    <button class="tool-btn" id="exportBtn" title="Esporta progressi come JSON">📤 Esporta</button>
    <button class="tool-btn" id="importBtn" title="Importa progressi da JSON">📥 Importa</button>
    <button class="tool-btn danger" id="resetBtn" title="Azzera progressi del mazzo corrente">↺ Reset</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden />
  </div>

  <!-- Progresso -->
  <div class="progress">
    <span id="counter">0 / 0</span>
    <div class="progress-bar"><div id="progressFill"></div></div>
    <span id="pct">0%</span>
  </div>

  <!-- Card -->
  <div id="cardWrap" class="card-wrap"></div>

  <!-- Azioni -->
  <div class="actions">
    <button id="prevBtn" class="btn">← Indietro</button>
    <button id="flipBtn" class="btn primary">Gira</button>
    <button id="nextBtn" class="btn">Avanti →</button>
  </div>
  <div class="actions secondary">
    <button id="knowBtn"   class="btn success">✓ Lo sapevo</button>
    <button id="reviewBtn" class="btn danger">✗ Da rivedere</button>
  </div>

  <footer><span id="stats">—</span></footer>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- ============================================================
       ORDINE OBBLIGATORIO:
       1) data.js  → DECKS
       2) meta.js  → temi + livelli + nuove carte
       3) tts.js   → sintesi vocale
       4) script app
       ============================================================ -->
  <script src="data.js"></script>
  <script src="meta.js"></script>
  <script src="tts.js"></script>

  <script>
  (function () {
    "use strict";

    // ================================================================
    // COSTANTI
    // ================================================================
    const STORAGE_KEY = "flashcard-progress-v2";
    const DAY_MS = 24 * 60 * 60 * 1000;
    const SRS_DAYS = [null, 1, 3, 7, 14, 30];

    // ================================================================
    // STATO
    // ================================================================
    const state = {
      deckId: null,
      theme: "",
      level: "",
      reviewOnly: false,
      dueOnly: false,
      autoSpeak: true,
      cards: [],
      index: 0,
      flipped: false,
      srs: {},
    };

    // ================================================================
    // PERSISTENZA
    // ================================================================
    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return {};
        const data = JSON.parse(raw);
        return data.srs || {};
      } catch (err) {
        console.warn("[app] Impossibile leggere localStorage:", err);
        return {};
      }
    }

    function saveProgress() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ srs: state.srs }));
      } catch (err) {
        console.warn("[app] Impossibile scrivere localStorage:", err);
      }
    }

    // ================================================================
    // SRS
    // ================================================================
    function srsKey(deckId, front) { return `${deckId}|${front}`; }
    function getSrs(front) { return state.srs[srsKey(state.deckId, front)] || null; }
    function isKnown(front) { const s = getSrs(front); return !!s && s.box >= 2; }
    function isReview(front) { const s = getSrs(front); return !!s && s.box === 1; }
    function isDue(front) { const s = getSrs(front); return !s || s.due <= Date.now(); }

    function markKnown(front) {
      const k = srsKey(state.deckId, front);
      const cur = state.srs[k];
      const box = Math.min((cur?.box || 0) + 1, 5);
      state.srs[k] = { box, due: Date.now() + SRS_DAYS[box] * DAY_MS };
    }

    function markReview(front) {
      const k = srsKey(state.deckId, front);
      state.srs[k] = { box: 1, due: Date.now() + SRS_DAYS[1] * DAY_MS };
    }

    function resetDeck() {
      const prefix = `${state.deckId}|`;
      for (const k of Object.keys(state.srs)) {
        if (k.startsWith(prefix)) delete state.srs[k];
      }
      saveProgress();
    }

    // ================================================================
    // MERGE (usato da import)
    // ================================================================
    function mergeSrs(local, incoming) {
      const out = { ...local };
      for (const [key, c] of Object.entries(incoming || {})) {
        const l = out[key];
        if (!l) { out[key] = c; continue; }
        if ((c.box || 0) > (l.box || 0)) out[key] = c;
        else if ((c.box || 0) === (l.box || 0) && (c.due || 0) > (l.due || 0)) out[key] = c;
      }
      return out;
    }

    // ================================================================
    // DOM
    // ================================================================
    const deckSel    = document.getElementById("deckSelect");
    const themeSel   = document.getElementById("themeSelect");
    const levelSel   = document.getElementById("levelSelect");
    const reviewChk  = document.getElementById("reviewOnly");
    const dueChk     = document.getElementById("dueOnly");
    const autoSpeakChk = document.getElementById("autoSpeak");
    const exportBtn  = document.getElementById("exportBtn");
    const importBtn  = document.getElementById("importBtn");
    const importFile = document.getElementById("importFile");
    const resetBtn   = document.getElementById("resetBtn");
    const cardWrap   = document.getElementById("cardWrap");
    const prevBtn    = document.getElementById("prevBtn");
    const nextBtn    = document.getElementById("nextBtn");
    const flipBtn    = document.getElementById("flipBtn");
    const knowBtn    = document.getElementById("knowBtn");
    const reviewBtn  = document.getElementById("reviewBtn");
    const counter    = document.getElementById("counter");
    const pctEl      = document.getElementById("pct");
    const fillEl     = document.getElementById("progressFill");
    const statsEl    = document.getElementById("stats");
    const toastEl    = document.getElementById("toast");

    // ================================================================
    // TOAST
    // ================================================================
    let toastTimer = null;
    function showToast(msg, type = "") {
      toastEl.textContent = msg;
      toastEl.className = "toast show " + type;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.remove("show");
      }, 2600);
    }

    // ================================================================
    // POPOLAMENTO UI
    // ================================================================
    function populateDecks() {
      deckSel.innerHTML = "";
      for (const deck of DECKS) {
        const opt = document.createElement("option");
        opt.value = deck.id;
        opt.textContent = `${deck.flag} ${deck.name} (${deck.cards.length})`;
        deckSel.appendChild(opt);
      }
      state.deckId = DECKS[0]?.id || null;
      deckSel.value = state.deckId;
    }

    function populateFilters() {
      const deck = DECKS.find((d) => d.id === state.deckId);
      if (!deck) return;

      themeSel.innerHTML = '<option value="">Tutti i temi</option>';
      for (const t of getThemesForCards(deck.cards)) {
        const opt = document.createElement("option");
        opt.value = t.id;
        opt.textContent = `${t.emoji} ${t.name}`;
        themeSel.appendChild(opt);
      }

      levelSel.innerHTML = '<option value="">Tutti i livelli</option>';
      for (const l of getLevelsForCards(deck.cards)) {
        const opt = document.createElement("option");
        opt.value = l.id;
        opt.textContent = l.name;
        levelSel.appendChild(opt);
      }

      themeSel.value = "";
      levelSel.value = "";
      state.theme = "";
      state.level = "";
    }

    // ================================================================
    // FILTRI
    // ================================================================
    function applyFilters(cards) {
      let result = filterCards(cards, {
        theme: state.theme || undefined,
        level: state.level || undefined,
      });
      if (state.reviewOnly) result = result.filter((c) => isReview(c.front));
      if (state.dueOnly)    result = result.filter((c) => isDue(c.front));
      return result;
    }

    function rebuildCards({ resetIndex = true } = {}) {
      const deck = DECKS.find((d) => d.id === state.deckId);
      if (!deck) return;
      state.cards = applyFilters(deck.cards);
      if (resetIndex) {
        state.index = 0;
        state.flipped = false;
      } else {
        if (state.index >= state.cards.length) state.index = state.cards.length - 1;
        if (state.index < 0) state.index = 0;
      }
      render();
    }

    // ================================================================
    // RENDER
    // ================================================================
    function render() {
      const total = state.cards.length;

      if (total === 0) {
        cardWrap.innerHTML = `
          <div class="empty">
            <h2>Nessuna carta trovata</h2>
            <p>Prova a cambiare tema, difficoltà o a togliere i filtri.</p>
          </div>`;
        counter.textContent = "0 / 0";
        pctEl.textContent = "0%";
        fillEl.style.width = "0%";
        setButtonsDisabled(true);
        updateStats();
        return;
      }

      setButtonsDisabled(false);
      if (state.index < 0) state.index = 0;
      if (state.index >= total) state.index = total - 1;

      const card = state.cards[state.index];
      const theme = THEMES.find((t) => t.id === card.theme);
      const themeLabel = theme ? `${theme.emoji} ${theme.name}` : card.theme || "";

      const s = getSrs(card.front);
      const box = s?.box || 0;
      const boxLabel = box === 0 ? "Nuova" : box >= 5 ? "Box 5 ⭐" : `Box ${box}`;
      const dueLabel = s ? formatDue(s.due) : "Subito";

      cardWrap.innerHTML = `
        <div class="card ${state.flipped ? "flipped" : ""}" id="cardEl">
          <button class="card-audio" id="audioBtn" title="Ascolta (TTS)" aria-label="Ascolta">🔊</button>
          <div class="card-face card-front">
            <span class="card-badge">${card.level || ""}</span>
            <span class="card-badge theme">${themeLabel}</span>
            <span class="card-badge box ${box >= 2 ? "active" : ""}">${boxLabel} · ${dueLabel}</span>
            ${card.emoji ? `<div class="card-emoji">${card.emoji}</div>` : ""}
            <div class="card-text">${escapeHtml(card.front)}</div>
            ${card.phon ? `<div class="card-phon">${escapeHtml(card.phon)}</div>` : ""}
            <div class="card-hint">Tocca per girare</div>
          </div>
          <div class="card-face card-back">
            <span class="card-badge">${card.level || ""}</span>
            <span class="card-badge theme">${themeLabel}</span>
            <span class="card-badge box ${box >= 2 ? "active" : ""}">${boxLabel} · ${dueLabel}</span>
            ${card.emoji ? `<div class="card-emoji">${card.emoji}</div>` : ""}
            <div class="card-text">${escapeHtml(card.back)}</div>
            <div class="card-hint">Tocca per tornare</div>
          </div>
        </div>`;

      document.getElementById("cardEl").addEventListener("click", (e) => {
        // Il click sul bottone audio non deve girare la card
        if (e.target.closest("#audioBtn")) return;
        flip();
      });
      document.getElementById("audioBtn").addEventListener("click", (e) => {
        e.stopPropagation();
        speakCurrent();
      });

      counter.textContent = `${state.index + 1} / ${total}`;
      const pct = Math.round(((state.index + 1) / total) * 100);
      pctEl.textContent = `${pct}%`;
      fillEl.style.width = `${pct}%`;

      prevBtn.disabled = state.index === 0;
      nextBtn.disabled = state.index === total - 1;
      flipBtn.textContent = state.flipped ? "Mostra fronte" : "Gira";

      updateStats();
    }

    function updateStats() {
      const total = state.cards.length;
      if (!total) { statsEl.textContent = "—"; return; }

      const known  = state.cards.filter((c) => isKnown(c.front)).length;
      const review = state.cards.filter((c) => isReview(c.front)).length;
      const due    = state.cards.filter((c) => isDue(c.front)).length;
      const newCnt = state.cards.filter((c) => !getSrs(c.front)).length;

      statsEl.innerHTML =
        `📚 Filtrate: <strong>${total}</strong> · ` +
        `🆕 Nuove: <strong>${newCnt}</strong> · ` +
        `✅ Sapute: <strong>${known}</strong> · ` +
        `🔴 Da rivedere: <strong>${review}</strong> · ` +
        `⏰ In scadenza: <strong>${due}</strong>`;
    }

    function formatDue(ts) {
      const diff = ts - Date.now();
      if (diff <= 0) return "oggi";
      const days = Math.ceil(diff / DAY_MS);
      if (days === 1) return "domani";
      return `tra ${days}g`;
    }

    // ================================================================
    // AZIONI
    // ================================================================
    function flip() {
      state.flipped = !state.flipped;
      render();
      if (state.flipped && state.autoSpeak) speakCurrent();
    }

    function next() {
      if (state.index < state.cards.length - 1) {
        state.index++;
        state.flipped = false;
        render();
      }
    }

    function prev() {
      if (state.index > 0) {
        state.index--;
        state.flipped = false;
        render();
      }
    }

    function markAndAdvance(result) {
      const card = state.cards[state.index];
      if (!card) return;

      if (result === "known")  markKnown(card.front);
      if (result === "review") markReview(card.front);
      saveProgress();

      const newCards = applyFilters(DECKS.find((d) => d.id === state.deckId).cards);
      const stillPresent = newCards.some((c) => c.front === card.front);
      state.cards = newCards;

      if (!stillPresent) {
        if (state.index >= state.cards.length) state.index = state.cards.length - 1;
        if (state.index < 0) state.index = 0;
      } else if (state.index < state.cards.length - 1) {
        state.index++;
      }

      state.flipped = false;
      render();
    }

    function doReset() {
      if (!confirm(`Azzerare tutti i progressi del mazzo "${state.deckId}"?`)) return;
      resetDeck();
      rebuildCards();
      showToast("Progressi azzerati", "success");
    }

    // ================================================================
    // TTS
    // ================================================================
    function speakCurrent() {
      const card = state.cards[state.index];
      if (!card || !window.TTS) return;
      const deck = DECKS.find((d) => d.id === state.deckId);
      const lang = deck?.lang || "en-US";
      const btn = document.getElementById("audioBtn");
      if (btn) btn.classList.add("speaking");

      TTS.speak(card.back, lang).finally(() => {
        const b = document.getElementById("audioBtn");
        if (b) b.classList.remove("speaking");
      });
    }

    // ================================================================
    // EXPORT / IMPORT
    // ================================================================
    exportBtn.addEventListener("click", () => {
      const payload = {
        version: 2,
        app: "flashcard-it",
        exportedAt: new Date().toISOString(),
        progress: JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"),
      };
      const blob = new Blob(
        [JSON.stringify(payload, null, 2)],
        { type: "application/json" }
      );
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `flashcard-backup-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);

      const count = Object.keys(payload.progress.srs || {}).length;
      showToast(`Esportate ${count} voci`, "success");
    });

    importBtn.addEventListener("click", () => importFile.click());

    importFile.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);

          // Accetta più formati: {progress:{srs}}, {srs}, oppure {key: {...}}
          let incoming;
          if (data.progress?.srs) incoming = data.progress.srs;
          else if (data.srs) incoming = data.srs;
          else if (data && typeof data === "object" && !Array.isArray(data)) incoming = data;
          else throw new Error("Formato JSON non riconosciuto");

          if (typeof incoming !== "object" || Array.isArray(incoming)) {
            throw new Error("Struttura non valida");
          }

          const count = Object.keys(incoming).length;
          if (count === 0) {
            showToast("File vuoto o senza progressi", "error");
            return;
          }

          const merge = confirm(
            `Trovate ${count} voci.\n\n` +
            `OK  = FONDI con i progressi attuali (consigliato)\n` +
            `Annulla = SOSTITUISCI completamente`
          );

          const current = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
          const next = merge
            ? { ...current, srs: mergeSrs(current.srs || {}, incoming) }
            : { srs: incoming };

          localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
          state.srs = next.srs || {};
          rebuildCards({ resetIndex: false });
          showToast(
            `Importate ${count} voci (${merge ? "merge" : "sostituzione"})`,
            "success"
          );
        } catch (err) {
          console.error(err);
          showToast("File JSON non valido: " + err.message, "error");
        }
      };
      reader.readAsText(file);
      e.target.value = "";
    });

    // ================================================================
    // UTILITY
    // ================================================================
    function setButtonsDisabled(disabled) {
      [prevBtn, nextBtn, flipBtn, knowBtn, reviewBtn].forEach((b) => {
        b.disabled = disabled;
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    // ================================================================
    // EVENTI
    // ================================================================
    deckSel.addEventListener("change", () => {
      state.deckId = deckSel.value;
      state.reviewOnly = false;
      state.dueOnly = false;
      reviewChk.checked = false;
      dueChk.checked = false;
      populateFilters();
      rebuildCards();
    });

    themeSel.addEventListener("change", () => {
      state.theme = themeSel.value;
      rebuildCards();
    });

    levelSel.addEventListener("change", () => {
      state.level = levelSel.value;
      rebuildCards();
    });

    reviewChk.addEventListener("change", () => {
      state.reviewOnly = reviewChk.checked;
      rebuildCards();
    });

    dueChk.addEventListener("change", () => {
      state.dueOnly = dueChk.checked;
      rebuildCards();
    });

    autoSpeakChk.addEventListener("change", () => {
      state.autoSpeak = autoSpeakChk.checked;
    });

    resetBtn.addEventListener("click", doReset);
    nextBtn.addEventListener("click", next);
    prevBtn.addEventListener("click", prev);
    flipBtn.addEventListener("click", flip);
    knowBtn.addEventListener("click", () => markAndAdvance("known"));
    reviewBtn.addEventListener("click", () => markAndAdvance("review"));

    document.addEventListener("keydown", (e) => {
      const tag = e.target.tagName;
      if (tag === "SELECT" || tag === "INPUT" || tag === "TEXTAREA") return;

      if (e.key === "ArrowRight") next();
      else if (e.key === "ArrowLeft") prev();
      else if (e.key === " ") { e.preventDefault(); flip(); }
      else if (e.key.toLowerCase() === "s") speakCurrent();
    });

    // ================================================================
    // BOOT
    // ================================================================
    state.srs = loadProgress();
    state.autoSpeak = autoSpeakChk.checked;
    populateDecks();
    populateFilters();
    rebuildCards();

    // Se le voci TTS non sono ancora caricate, avvisa quando lo sono
    if (window.TTS) {
      TTS.onVoicesReady(() => {
        const voice = TTS.pickBestVoice(
          DECKS.find((d) => d.id === state.deckId)?.lang || "en-US"
        );
        if (voice) console.log("[tts] Voce selezionata:", voice.name, voice.lang);
      });
    }
  })();
  </script>
</body>
</html>
