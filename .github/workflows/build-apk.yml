name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'        # ← Capacitor 8 richiede Node 22+

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'        # ← Capacitor 8 richiede Java 21

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Flashcard-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Flashcard-debug.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Flashcard — ultima build" \
            --notes "APK debug generato da ${GITHUB_SHA::7}. Abilita l'installazione da fonti sconosciute per installarlo."
